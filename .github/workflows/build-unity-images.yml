name: 🛠️ Build Unity Images

on:
  pull_request:
    paths:
      - ".github/workflows/build-unity-images.yml"
      - "images/ubuntu/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/atxlan
  IMAGE_VERSION: "6"

jobs:
  build-base:
    name: 🧱 Build Base Image
    runs-on: viberimages
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get release tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v4.0.0")
          echo "value=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Using tag: ${LATEST_TAG}"

      - name: Login to Docker Hub
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: base
          tags: ubuntu-${{ steps.tag.outputs.value }} latest
          containerfiles: |
            ./images/ubuntu/base/Dockerfile
          context: .
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push base image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_PREFIX }}

  build-hub:
    name: 🔗 Build Hub Image
    runs-on: viberimages
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build hub image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: hub
          tags: ubuntu-${{ needs.build-base.outputs.tag }} latest
          containerfiles: |
            ./images/ubuntu/hub/Dockerfile
          context: .
          build-args: |
            baseImage=${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ needs.build-base.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push hub image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_PREFIX }}

  build-editor:
    name: 🎮 Build Editor (${{ matrix.unityVersion }}-${{ matrix.targetPlatform }})
    runs-on: viberimages
    needs: [build-base, build-hub]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        unityVersion:
          - 6000.3.13f1
        targetPlatform:
          - base
          - linux-il2cpp
          - windows-mono
          - mac-mono
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 🔍 Find changeSet for ${{ matrix.unityVersion }}
        id: changeSet
        run: echo "value=$(npx --yes unity-changeset@latest ${{ matrix.unityVersion }})" | tee $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: redhat-actions/podman-login@v1
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build editor image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        timeout-minutes: 90
        with:
          image: editor
          tags: ubuntu-${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}-${{ env.IMAGE_VERSION }} ${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}
          containerfiles: |
            ./images/ubuntu/editor/Dockerfile
          context: .
          build-args: |
            baseImage=${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ needs.build-base.outputs.tag }}
            hubImage=${{ env.IMAGE_PREFIX }}/hub:ubuntu-${{ needs.build-base.outputs.tag }}
            version=${{ matrix.unityVersion }}
            changeSet=${{ steps.changeSet.outputs.value }}
            module=${{ matrix.targetPlatform }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Push editor image
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.IMAGE_PREFIX }}

      - name: 📊 Report disk usage
        if: always()
        run: df -h
