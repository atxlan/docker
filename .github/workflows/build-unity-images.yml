name: 🛠️ Build Unity Images

on:
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to registry"
        required: true
        default: "true"
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/atxlan/docker
  IMAGE_VERSION: "4"

jobs:
  build-base:
    name: 🧱 Build Base Image
    runs-on: viber
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Get release tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v4.0.0")
          echo "value=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Using tag: ${LATEST_TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/ubuntu/base/Dockerfile
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ steps.tag.outputs.value }}
            ${{ env.IMAGE_PREFIX }}/base:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-hub:
    name: 🔗 Build Hub Image
    runs-on: viber
    needs: build-base
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push hub image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./images/ubuntu/hub/Dockerfile
          build-args: |
            baseImage=${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ needs.build-base.outputs.tag }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/hub:ubuntu-${{ needs.build-base.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/hub:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

  build-editor:
    name: 🎮 Build Editor (${{ matrix.unityVersion }}-${{ matrix.targetPlatform }})
    runs-on: viber
    needs: [build-base, build-hub]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        unityVersion:
          - 6000.3.0f1
          - 6000.2.10f1
          - 6000.2.14f1
        targetPlatform:
          - base
          - linux-il2cpp
          - windows-mono
          - mac-mono
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 🔍 Find changeSet for ${{ matrix.unityVersion }}
        id: changeSet
        run: echo "value=$(npx --yes unity-changeset@latest ${{ matrix.unityVersion }})" | tee $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push editor image
        uses: docker/build-push-action@v6
        id: build
        continue-on-error: true
        timeout-minutes: 90
        with:
          context: .
          file: ./images/ubuntu/editor/Dockerfile
          build-args: |
            baseImage=${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ needs.build-base.outputs.tag }}
            hubImage=${{ env.IMAGE_PREFIX }}/hub:ubuntu-${{ needs.build-base.outputs.tag }}
            version=${{ matrix.unityVersion }}
            changeSet=${{ steps.changeSet.outputs.value }}
            module=${{ matrix.targetPlatform }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/editor:ubuntu-${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}-${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_PREFIX }}/editor:${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 💤 Sleep before retry
        if: steps.build.outcome == 'failure'
        run: sleep 60

      - name: Build and push editor image (retry)
        uses: docker/build-push-action@v6
        if: steps.build.outcome == 'failure'
        timeout-minutes: 90
        with:
          context: .
          file: ./images/ubuntu/editor/Dockerfile
          build-args: |
            baseImage=${{ env.IMAGE_PREFIX }}/base:ubuntu-${{ needs.build-base.outputs.tag }}
            hubImage=${{ env.IMAGE_PREFIX }}/hub:ubuntu-${{ needs.build-base.outputs.tag }}
            version=${{ matrix.unityVersion }}
            changeSet=${{ steps.changeSet.outputs.value }}
            module=${{ matrix.targetPlatform }}
          push: ${{ inputs.push }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/editor:ubuntu-${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}-${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_PREFIX }}/editor:${{ matrix.unityVersion }}-${{ matrix.targetPlatform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 📊 Report disk usage
        if: always()
        run: df -h
